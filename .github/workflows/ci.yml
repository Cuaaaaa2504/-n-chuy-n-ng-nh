name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: San Ve Backend3/cinehunt-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: San Ve Backend3/cinehunt-backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  sql-integration:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: San Ve Backend3/cinehunt-backend
    env:
      DB_HOST: ${{ secrets.CI_DB_HOST }}
      DB_PORT: ${{ secrets.CI_DB_PORT || '1433' }}
      DB_USERNAME: ${{ secrets.CI_DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      DB_DATABASE: ${{ secrets.CI_DB_DATABASE }}
      DB_ENCRYPT: ${{ secrets.CI_DB_ENCRYPT }}
      DB_TRUST_SERVER_CERTIFICATE: ${{ secrets.CI_DB_TRUST_SERVER_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: San Ve Backend3/cinehunt-backend/package-lock.json
      - run: npm ci
      - name: Verify SQL integration secrets
        shell: bash
        run: |
          missing=0
          for name in DB_HOST DB_USERNAME DB_PASSWORD DB_DATABASE; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret CI_${name}"
              missing=1
            fi
          done
          exit "$missing"
      - run: npm run migration:run
      - run: npm run test:integration:sql

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: San Ve Frontend/San Ve Frontend/frontend1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: San Ve Frontend/San Ve Frontend/frontend1/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  recommendation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recommendation-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: recommendation-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: python smoke_test.py
