<style>
        body {
            background-color: theme('colors.ultra-dark-navy');
            background-image: radial-gradient(circle at 50% 50%, rgba(76, 215, 246, 0.05) 0%, transparent 50%),
                              radial-gradient(circle at 100% 0%, rgba(255, 177, 196, 0.05) 0%, transparent 50%);
            min-height: 100vh;
        }
        
        .ticket-glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(76, 215, 246, 0.15);
            position: relative;
            overflow: hidden;
        }
        
        .ticket-glass::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(76, 215, 246, 0.1), transparent);
            transform: skewX(-20deg);
            animation: shine 5s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .neon-border {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 1px solid theme('colors.secondary');
            border-radius: inherit;
            opacity: 0;
            transition: opacity 0.3s ease, box-shadow 0.3s ease;
            pointer-events: none;
        }

        .ticket-glass:hover .neon-border {
            opacity: 1;
            box-shadow: inset 0 0 15px rgba(76, 215, 246, 0.3),
                        0 0 20px rgba(76, 215, 246, 0.4);
        }

        .primary-btn {
            background: linear-gradient(135deg, theme('colors.on-primary-fixed-variant'), theme('colors.neon-pink'));
            box-shadow: 0 0 15px rgba(255, 177, 196, 0.5);
            transition: all 0.3s ease;
        }
        .primary-btn:hover {
            box-shadow: 0 0 25px rgba(255, 177, 196, 0.8);
            transform: scale(1.02);
        }

        .secondary-btn {
            border: 1px solid theme('colors.secondary');
            color: theme('colors.secondary');
            background: transparent;
            transition: all 0.3s ease;
        }
        .secondary-btn:hover {
            box-shadow: 0 0 15px rgba(76, 215, 246, 0.5), inset 0 0 10px rgba(76, 215, 246, 0.3);
            text-shadow: 0 0 8px theme('colors.secondary');
        }

        .ticket-cutout {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: theme('colors.ultra-dark-navy');
            border-radius: 50%;
            top: 65%;
            z-index: 10;
        }
        .ticket-cutout.left {
            left: -15px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        .ticket-cutout.right {
            right: -15px;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }
        .ticket-divider {
            position: absolute;
            top: 65%;
            left: 20px;
            right: 20px;
            height: 1px;
            border-top: 2px dashed rgba(255, 255, 255, 0.2);
            margin-top: 14px;
        }
        
        .qr-container {
            position: relative;
        }
        .qr-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(221, 183, 255, 0.4) 50%, transparent 100%);
            background-size: 100% 200%;
            animation: scan 2s linear infinite;
            pointer-events: none;
        }
        @keyframes scan {
            0% { background-position: 0 -100%; }
            100% { background-position: 0 200%; }
        }
    </style>
</head>
