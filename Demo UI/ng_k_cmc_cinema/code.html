<!DOCTYPE html><html class="dark" lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Đăng ký - CMC Cinema</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&amp;family=Space+Grotesk:wght@500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#acedff",
                        "inverse-surface": "#e8e0e7",
                        "surface-container-lowest": "#100d11",
                        "on-primary-container": "#644483",
                        "surface-container-low": "#1d1b1f",
                        "tertiary": "#e7e785",
                        "glass-surface": "rgba(17, 19, 26, 0.6)",
                        "on-error": "#690005",
                        "surface-variant": "#373438",
                        "surface-container-high": "#2c292d",
                        "surface-container-highest": "#373438",
                        "on-tertiary-container": "#555500",
                        "secondary-container": "#03b5d4",
                        "tertiary-fixed-dim": "#cbcb6c",
                        "on-secondary-container": "#00424e",
                        "on-secondary-fixed-variant": "#004e5c",
                        "tertiary-fixed": "#e8e885",
                        "primary": "#f0daff",
                        "surface-tint": "#ddb7ff",
                        "on-primary-fixed": "#2a0848",
                        "neon-pink": "#ffb1c4",
                        "outline-variant": "#4b444f",
                        "tertiary-container": "#cbcb6c",
                        "on-tertiary-fixed-variant": "#494900",
                        "inverse-primary": "#715090",
                        "surface": "#151217",
                        "on-primary-fixed-variant": "#583876",
                        "on-error-container": "#ffdad6",
                        "secondary": "#4cd7f6",
                        "on-background": "#e8e0e7",
                        "outline": "#968e99",
                        "on-secondary-fixed": "#001f26",
                        "error-container": "#93000a",
                        "primary-fixed-dim": "#ddb7ff",
                        "background": "#151217",
                        "on-surface-variant": "#cdc3d0",
                        "on-surface": "#e8e0e7",
                        "ultra-dark-navy": "#05070d",
                        "secondary-fixed-dim": "#4cd7f6",
                        "primary-fixed": "#f0dbff",
                        "primary-container": "#ddb7ff",
                        "on-tertiary-fixed": "#1d1d00",
                        "surface-bright": "#3b383d",
                        "surface-container": "#211f23",
                        "on-secondary": "#003640",
                        "on-tertiary": "#323200",
                        "on-primary": "#40215e",
                        "surface-dim": "#151217",
                        "inverse-on-surface": "#332f34",
                        "error": "#ffb4ab"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "baseline": "4px",
                        "margin-desktop": "64px",
                        "margin-mobile": "20px",
                        "gutter-mobile": "16px",
                        "gutter-desktop": "24px",
                        "container-max": "1280px"
                    },
                    "fontFamily": {
                        "body-md": ["Montserrat"],
                        "display-lg": ["Montserrat"],
                        "title-md": ["Montserrat"],
                        "headline-lg-mobile": ["Montserrat"],
                        "headline-lg": ["Montserrat"],
                        "label-sm": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .cyber-bg {
            background-image: radial-gradient(circle at 50% 50%, rgba(76, 215, 246, 0.1) 0%, rgba(5, 7, 13, 1) 100%);
        }
        
        .neon-glow {
            box-shadow: 0 0 15px rgba(255, 177, 196, 0.6);
            background: linear-gradient(135deg, #715090 0%, #ffb1c4 100%);
        }
        
        .neon-glow:hover {
            box-shadow: 0 0 25px rgba(255, 177, 196, 0.8);
            transform: scale(1.02);
        }
        
        .input-glow:focus-within {
            border-color: #4cd7f6;
            box-shadow: 0 0 10px rgba(76, 215, 246, 0.5);
        }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-ultra-dark-navy text-on-surface font-body-md min-h-screen flex items-center justify-center relative overflow-hidden cyber-bg">
<!-- Ambient background image -->
<div class="absolute inset-0 bg-cover bg-center opacity-30 z-0" data-alt="A sprawling cyberpunk cityscape at night, viewed from a high vantage point. The scene is illuminated by vibrant neon lights in shades of cyan, electric purple, and hot pink. Flying vehicles leave light trails in the distance. The mood is futuristic, energetic, and slightly mysterious, fitting for a sci-fi cinema experience." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDJE3DLTmMtqT6tITbI6yigBcNhbEuQVp2xP7R8rXgRFfXZyl_z-pLSx2COf_R53u3S9oATDEwzPC71lSQJkXroYjlAR1a11q-O0p3vDNK-mk1qjUUQpTP7PoAHeaA1M_GUTz5zBb8-gIT819RhlkX3QXnlsF0r4Hj8yPMWgfcX-kIpn5n1rjeU0k_L4Jx0NHFx7gsT8MXNDLHD6eITM0mwhDUB26xBIKDVp3fA0O0EzzWby_n2UMy7IVciZdYVfym0qWL2dLPqbxQ')"></div>
<!-- Cyber City Overlay (Animated if possible, static gradient for now) -->
<div class="absolute inset-0 bg-gradient-to-t from-ultra-dark-navy via-transparent to-ultra-dark-navy opacity-80 z-0 pointer-events-none"></div>
<div class="relative z-10 w-full max-w-md px-margin-mobile md:px-0">
<!-- Logo Area -->
<div class="text-center mb-8">
<h1 class="font-display-lg text-display-lg font-extrabold text-primary drop-shadow-[0_0_10px_rgba(240,218,255,0.8)]">
                CMC Cinema
            </h1>
<p class="font-body-md text-body-md text-secondary mt-2">Tham gia kỷ nguyên rạp chiếu phim kỹ thuật số</p>
</div>
<!-- Registration Form Card -->
<div class="glass-panel rounded-xl p-8 shadow-[0_0_30px_rgba(0,0,0,0.5)]">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-6 text-center">
                Đăng ký tài khoản
            </h2>
<form action="#" class="space-y-4" method="POST">
<!-- Full Name -->
<div class="relative input-glow rounded-lg transition-all duration-300 bg-[rgba(0,0,0,0.3)] border border-white/10">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-transparent border-none rounded-lg text-on-surface placeholder-on-surface-variant focus:ring-0 focus:outline-none" id="fullname" name="fullname" placeholder="Họ và tên" required="" type="text">
</div>
<!-- Email -->
<div class="relative input-glow rounded-lg transition-all duration-300 bg-[rgba(0,0,0,0.3)] border border-white/10">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-transparent border-none rounded-lg text-on-surface placeholder-on-surface-variant focus:ring-0 focus:outline-none" id="email" name="email" placeholder="Email" required="" type="email">
</div>
<!-- Phone -->
<div class="relative input-glow rounded-lg transition-all duration-300 bg-[rgba(0,0,0,0.3)] border border-white/10">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">phone</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-transparent border-none rounded-lg text-on-surface placeholder-on-surface-variant focus:ring-0 focus:outline-none" id="phone" name="phone" placeholder="Số điện thoại" required="" type="tel">
</div>
<!-- Password -->
<div class="relative input-glow rounded-lg transition-all duration-300 bg-[rgba(0,0,0,0.3)] border border-white/10">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 bg-transparent border-none rounded-lg text-on-surface placeholder-on-surface-variant focus:ring-0 focus:outline-none" id="password" name="password" placeholder="Mật khẩu" required="" type="password">
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-secondary transition-colors" onclick="togglePassword('password')" type="button">
<span class="material-symbols-outlined" id="password-icon">visibility</span>
</button>
</div>
<!-- Confirm Password -->
<div class="relative input-glow rounded-lg transition-all duration-300 bg-[rgba(0,0,0,0.3)] border border-white/10">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock_reset</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 bg-transparent border-none rounded-lg text-on-surface placeholder-on-surface-variant focus:ring-0 focus:outline-none" id="confirm_password" name="confirm_password" placeholder="Nhập lại mật khẩu" required="" type="password">
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-secondary transition-colors" onclick="togglePassword('confirm_password')" type="button">
<span class="material-symbols-outlined" id="confirm_password-icon">visibility</span>
</button>
</div>
<!-- Submit Button -->
<button class="w-full neon-glow text-white font-title-md text-title-md py-3 rounded-lg mt-6 transition-all duration-300 flex justify-center items-center gap-2" type="submit">
<span>Đăng ký ngay</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Login Link -->
<div class="mt-6 text-center font-body-md text-body-md">
<span class="text-on-surface-variant">Đã có tài khoản?</span>
<a class="text-secondary hover:text-primary transition-colors ml-1 font-title-md text-title-md" href="#">Đăng nhập</a>
</div>
</div>
</div>
<script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(inputId + '-icon');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }
    </script>
</body></html>
