<style>
        body {
            background-color: #05070d; /* Level 1 Background */
            color: #e8e0e7; /* on-background */
            overflow: hidden;
        }
        
        /* Glassmorphism Classes */
        .glass-panel {
            background-color: rgba(15, 23, 42, 0.6); /* Adjusted for visual match, actual token is glass-surface but instructions specified this value for Level 2 */
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-modal {
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(240, 218, 255, 0.15); /* primary glow */
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(90deg, #715090, #ffb1c4); /* Electric Purple to Neon Pink approx based on tokens */
            box-shadow: 0 0 15px rgba(255, 177, 196, 0.6); /* neon-pink glow */
            color: #ffffff;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            box-shadow: 0 0 25px rgba(255, 177, 196, 0.9);
            transform: scale(1.05);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #4cd7f6; /* secondary */
            color: #4cd7f6;
            box-shadow: inset 0 0 5px rgba(76, 215, 246, 0.2);
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            box-shadow: inset 0 0 10px rgba(76, 215, 246, 0.5), 0 0 15px rgba(76, 215, 246, 0.5);
            background-color: rgba(76, 215, 246, 0.1);
        }

        /* Glitch effect for 403 */
        .glitch-wrapper {
            position: relative;
        }
        .glitch-text {
            position: relative;
            display: inline-block;
        }
        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #05070d;
        }
        .glitch-text::before {
            left: 2px;
            text-shadow: -2px 0 #ffb4ab; /* error */
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }
        .glitch-text::after {
            left: -2px;
            text-shadow: -2px 0 #4cd7f6; /* secondary */
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(31px, 9999px, 9px, 0); }
            5% { clip: rect(70px, 9999px, 83px, 0); }
            10% { clip: rect(44px, 9999px, 2px, 0); }
            15% { clip: rect(59px, 9999px, 54px, 0); }
            20% { clip: rect(2px, 9999px, 40px, 0); }
            25% { clip: rect(96px, 9999px, 91px, 0); }
            30% { clip: rect(48px, 9999px, 3px, 0); }
            35% { clip: rect(82px, 9999px, 20px, 0); }
            40% { clip: rect(21px, 9999px, 60px, 0); }
            45% { clip: rect(98px, 9999px, 5px, 0); }
            50% { clip: rect(11px, 9999px, 63px, 0); }
            55% { clip: rect(77px, 9999px, 43px, 0); }
            60% { clip: rect(4px, 9999px, 86px, 0); }
            65% { clip: rect(51px, 9999px, 28px, 0); }
            70% { clip: rect(35px, 9999px, 14px, 0); }
            75% { clip: rect(100px, 9999px, 71px, 0); }
            80% { clip: rect(88px, 9999px, 98px, 0); }
            85% { clip: rect(66px, 9999px, 17px, 0); }
            90% { clip: rect(22px, 9999px, 7px, 0); }
            95% { clip: rect(13px, 9999px, 94px, 0); }
            100% { clip: rect(55px, 9999px, 33px, 0); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(94px, 9999px, 30px, 0); }
            5% { clip: rect(1px, 9999px, 61px, 0); }
            10% { clip: rect(20px, 9999px, 42px, 0); }
            15% { clip: rect(43px, 9999px, 81px, 0); }
            20% { clip: rect(78px, 9999px, 12px, 0); }
            25% { clip: rect(50px, 9999px, 99px, 0); }
            30% { clip: rect(28px, 9999px, 6px, 0); }
            35% { clip: rect(85px, 9999px, 24px, 0); }
            40% { clip: rect(14px, 9999px, 57px, 0); }
            45% { clip: rect(63px, 9999px, 89px, 0); }
            50% { clip: rect(3px, 9999px, 37px, 0); }
            55% { clip: rect(91px, 9999px, 72px, 0); }
            60% { clip: rect(41px, 9999px, 16px, 0); }
            65% { clip: rect(74px, 9999px, 95px, 0); }
            70% { clip: rect(18px, 9999px, 52px, 0); }
            75% { clip: rect(55px, 9999px, 29px, 0); }
            80% { clip: rect(99px, 9999px, 8px, 0); }
            85% { clip: rect(32px, 9999px, 64px, 0); }
            90% { clip: rect(69px, 9999px, 46px, 0); }
            95% { clip: rect(9px, 9999px, 83px, 0); }
            100% { clip: rect(48px, 9999px, 21px, 0); }
        }

        /* Scanline effect */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }
