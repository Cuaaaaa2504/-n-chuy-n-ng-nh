<!DOCTYPE html><html class="dark" lang="vi"><head>

<style>
        body {
            background-color: theme('colors.ultra-dark-navy');
            color: theme('colors.on-background');
            min-height: 100vh;
        }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .neon-border-focus:focus-within {
            border-color: theme('colors.secondary');
            box-shadow: 0 0 15px rgba(76, 215, 246, 0.3);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, theme('colors.inverse-primary'), theme('colors.neon-pink'));
            box-shadow: 0 0 15px rgba(255, 177, 196, 0.4);
            color: white;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            box-shadow: 0 0 25px rgba(255, 177, 196, 0.6);
            transform: scale(1.02);
        }
        
        .status-valid {
            color: theme('colors.secondary');
            text-shadow: 0 0 8px rgba(76, 215, 246, 0.6);
        }
        
        .scanner-line {
            animation: scan 2s infinite linear;
            background: linear-gradient(to bottom, transparent, theme('colors.secondary'), transparent);
        }
        
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>
</head>
<body class="flex flex-col md:flex-row">
<!-- Content Canvas -->
<main class="flex-1 min-h-screen flex items-center justify-center p-4 md:p-8 relative">
<!-- Ambient Background Glow -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary/5 rounded-full blur-[100px]"></div>
<div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-secondary/5 rounded-full blur-[100px]"></div>
</div>
<div class="w-full max-w-2xl z-10 grid gap-8">
<!-- Header/Logo Area (Simplified for Staff Tool) -->
<div class="text-center space-y-2">
<h1 class="font-display-lg text-display-lg font-extrabold text-primary drop-shadow-[0_0_10px_rgba(240,218,255,0.8)]">CMC Checkin</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Quét mã QR hoặc nhập mã vé thủ công</p>
</div>
<!-- Scanner & Input Section -->
<div class="glass-panel rounded-xl p-6 md:p-8 flex flex-col md:flex-row gap-8">
<!-- QR Scanner Area -->
<div class="flex-1 flex flex-col items-center justify-center gap-4">
<div class="relative w-48 h-48 border-2 border-dashed border-outline-variant rounded-lg flex items-center justify-center overflow-hidden bg-black/30">
<span class="material-symbols-outlined text-outline-variant text-5xl">qr_code_scanner</span>
<!-- Mock Scanner Line -->
<div class="scanner-line absolute left-0 right-0 h-1 z-10 w-full shadow-[0_0_8px_theme('colors.secondary')]"></div>
</div>
<button class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-sm">cameraswitch</span>
                        Đổi camera
                    </button>
</div>
<!-- Divider -->
<div class="hidden md:block w-px bg-white/10 self-stretch"></div>
<div class="md:hidden h-px bg-white/10 w-full"></div>
<!-- Manual Input Area -->
<div class="flex-1 flex flex-col justify-center gap-4">
<label class="font-title-md text-title-md text-on-surface">Nhập mã vé</label>
<div class="flex gap-2">
<input class="w-full bg-black/30 border border-white/10 rounded-DEFAULT px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none neon-border-focus transition-all placeholder:text-outline-variant" placeholder="VD: TCK-8X92-K1" type="text">
<button class="bg-surface-variant text-on-surface px-4 py-3 rounded-DEFAULT hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined">search</span>
</button>
</div>
</div>
</div>
<!-- Ticket Information Card (Simulating successful scan) -->
<div class="glass-panel rounded-xl p-6 md:p-8 relative overflow-hidden group">
<!-- Inner Glow on Hover -->
<div class="absolute inset-0 bg-secondary/5 opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none rounded-xl"></div>
<div class="flex flex-col md:flex-row gap-6">
<!-- Movie Poster Thumbnail -->
<div class="w-24 h-36 flex-shrink-0 rounded-lg overflow-hidden border border-white/10">
<div class="w-full h-full bg-cover bg-center" data-alt="A small, stylized movie poster thumbnail for a sci-fi cyberpunk film featuring glowing neon cityscapes and a lone figure. Dark, moody lighting with electric blue and hot pink accents." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDW6A0YAVXVK8d0jy3vZUJRwoNYjtlEHFFlPBs52gdahJ1jV6TPw3iwoa0pWY50CFkZOpcY5Ff7IEYjkLEOzfOZlAwN7RZclJXRBLdkQ1w0qCEbP_UT8zNc59idLPBihMItE3ije6dg0DTMrSEmWlAWpLT69igtVEWTO4wv9eJWrAAR3jWlzzP05OAf59lJh37bNbOUizMzFCI_wJGnuCVryW0SSllENsgn8dUyfg7l2s25bsc8OTQkCj5N3_KRZpe8s4cTad7HXg4')"></div>
</div>
<!-- Ticket Details -->
<div class="flex-1 flex flex-col justify-between">
<div>
<div class="flex justify-between items-start mb-2">
<h2 class="font-title-md text-title-md text-primary">Cybernetic Dreams</h2>
<!-- Status Badge -->
<div class="px-3 py-1 rounded-full bg-secondary/10 border border-secondary/30 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px] status-valid">check_circle</span>
<span class="font-label-sm text-label-sm status-valid">Hợp lệ</span>
</div>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mb-4">Phòng chiếu số 04 • Định dạng 2D/Phụ đề</p>
</div>
<div class="grid grid-cols-2 gap-4">
<div>
<p class="font-label-sm text-label-sm text-outline-variant">SUẤT CHIẾU</p>
<p class="font-title-md text-title-md text-on-surface">19:30 - Hôm nay</p>
</div>
<div>
<p class="font-label-sm text-label-sm text-outline-variant">GHẾ NGỒI</p>
<p class="font-title-md text-title-md text-secondary">H12, H13</p>
</div>
</div>
</div>
</div>
<!-- Action Button -->
<div class="mt-8 pt-6 border-t border-white/10 flex justify-end">
<button class="btn-primary font-title-md text-title-md px-8 py-3 rounded-lg flex items-center gap-2 w-full md:w-auto justify-center">
<span class="material-symbols-outlined">done_all</span>
                        Xác nhận Check-in
                    </button>
</div>
</div>
</div>
</main>
</body></html>
