<style>
        body { background-color: #05070d; color: #e8e0e7; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .seat {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .seat.available {
            border: 1px solid #968e99;
            background: rgba(255,255,255,0.05);
        }
        .seat.available:hover {
            border-color: #4cd7f6;
            box-shadow: 0 0 10px rgba(76, 215, 246, 0.5);
        }
        .seat.selected {
            background-color: #4cd7f6;
            border-color: #4cd7f6;
            box-shadow: 0 0 15px rgba(76, 215, 246, 0.8);
            color: #003640;
        }
        .seat.booked {
            background-color: #373438;
            border-color: #4b444f;
            cursor: not-allowed;
            opacity: 0.5;
        }
        .seat.vip.available { border-color: #f0daff; }
        .seat.vip.selected {
            background-color: #f0daff;
            border-color: #f0daff;
            box-shadow: 0 0 15px rgba(240, 218, 255, 0.8);
            color: #2a0848;
        }
        .seat.couple { width: 64px; }
        .screen-curve {
            height: 60px;
            width: 100%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0) 100%);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }
        .screen-curve::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, rgba(76, 215, 246, 0.2), rgba(240, 218, 255, 0.2));
            mix-blend-mode: overlay;
        }
    </style>

        </div>

</div>

<div class="border-t border-white/10 pt-4 mb-6">

<span class="font-title-md text-title-md text-secondary" id="selected-seats-display">Chưa chọn</span>
</div>
<div class="flex justify-between items-center">
<span class="font-label-sm text-label-sm text-outline">Tổng tiền:</span>
<span class="font-headline-lg text-headline-lg text-primary" id="total-price-display">0 đ</span>

                    </button>

</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const seatGrid = document.getElementById('seat-grid');
            const selectedSeatsDisplay = document.getElementById('selected-seats-display');
            const totalPriceDisplay = document.getElementById('total-price-display');
            
            const rows = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'J', 'K'];
            const seatsPerRow = 14;
            const prices = { standard: 80000, vip: 120000, couple: 250000 };
            
            let selectedSeats = [];
            let total = 0;

            function formatCurrency(amount) {
                return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
            }

            function updateSummary() {
                if (selectedSeats.length === 0) {
                    selectedSeatsDisplay.textContent = 'Chưa chọn';
                    selectedSeatsDisplay.className = 'font-title-md text-title-md text-outline';
                } else {
                    selectedSeatsDisplay.textContent = selectedSeats.map(s => s.id).join(', ');
                    selectedSeatsDisplay.className = 'font-title-md text-title-md text-secondary';
                }
                totalPriceDisplay.textContent = formatCurrency(total);
            }

            rows.forEach((row, rowIndex) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'flex gap-2 items-center';
                
                const rowLabel = document.createElement('span');
                rowLabel.className = 'w-6 text-center font-label-sm text-label-sm text-outline mr-2';
                rowLabel.textContent = row;
                rowDiv.appendChild(rowLabel);

                const isVipRow = rowIndex >= 3 && rowIndex <= 7;
                const isCoupleRow = rowIndex === 9;
                
                let cols = isCoupleRow ? seatsPerRow / 2 : seatsPerRow;

                for (let i = 1; i <= cols; i++) {
                    // Add aisle space
                    if (!isCoupleRow && (i === 4 || i === 12)) {
                        const spacer = document.createElement('div');
                        spacer.className = 'w-6';
                        rowDiv.appendChild(spacer);
                    }

                    const seat = document.createElement('div');
                    const seatId = `${row}${i}`;
                    let typeClass = 'standard';
                    let price = prices.standard;

                    if (isVipRow) {
                        typeClass = 'vip';
                        price = prices.vip;
                    } else if (isCoupleRow) {
                        typeClass = 'couple';
                        price = prices.couple;
                    }

                    // Randomly book some seats
                    const statusClass = Math.random() < 0.2 ? 'booked' : 'available';

                    seat.className = `seat ${typeClass} ${statusClass} h-8 flex items-center justify-center rounded font-label-sm text-[10px] text-transparent hover:text-current transition-colors`;
                    seat.dataset.id = seatId;
                    seat.dataset.price = price;
                    seat.dataset.status = statusClass;
                    
                    if (!isCoupleRow) seat.classList.add('w-8');
                    seat.textContent = i;

                    if (statusClass === 'available') {
                        seat.addEventListener('click', () => {
                            if (seat.classList.contains('selected')) {
                                seat.classList.remove('selected');
                                selectedSeats = selectedSeats.filter(s => s.id !== seatId);
                                total -= price;
                            } else {
                                seat.classList.add('selected');
                                selectedSeats.push({ id: seatId, price: price });
                                total += price;
                            }
                            updateSummary();
                        });
                    }

                    rowDiv.appendChild(seat);
                }
                
                const rowLabelEnd = document.createElement('span');
                rowLabelEnd.className = 'w-6 text-center font-label-sm text-label-sm text-outline ml-2';
                rowLabelEnd.textContent = row;
                rowDiv.appendChild(rowLabelEnd);

                seatGrid.appendChild(rowDiv);
            });
        });
    </script>
